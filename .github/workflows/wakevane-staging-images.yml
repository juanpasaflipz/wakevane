name: WakeVane staging images
on:
  push:
    branches: [staging/egm-orchestration-20261103]
permissions:
  contents: read
concurrency:
  group: wakevane-staging-images
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'juanpasaflipz/wakevane'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            target: runtime
            extras: modal
          - image: host
            target: host
            extras: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name isolated staging image
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          IMAGE_KIND: ${{ matrix.image }}
        run: |
          set -euo pipefail
          echo "ref=ghcr.io/${REPOSITORY,,}-staging-${IMAGE_KIND}:sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Build matching release
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          build-args: OMNIGENT_EXTRAS=${{ matrix.extras }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha,scope=wakevane-staging-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=wakevane-staging-${{ matrix.image }}
          provenance: false
      - name: Verify installed orchestration source
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          IMAGE_KIND: ${{ matrix.image }}
        run: |
          set -euo pipefail
          EXPECTED=$(sha256sum omnigent/runner/egm_review.py | cut -d ' ' -f 1)
          docker run --rm --entrypoint python -e EXPECTED="$EXPECTED" "$IMAGE_REF" -c 'import hashlib,os,pathlib; import omnigent.runner.egm_review as m; import omnigent.tools.builtins.egm_review; assert hashlib.sha256(pathlib.Path(m.__file__).read_bytes()).hexdigest() == os.environ["EXPECTED"]'
          if [ "$IMAGE_KIND" = server ]; then
            docker run --rm --entrypoint python "$IMAGE_REF" -c 'import modal; import omnigent.server.compute_meter'
          fi
      - name: Publish verified staging image
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          docker push "$IMAGE_REF"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_REF")
          test -n "$DIGEST"
          printf 'Image: `%s`\n\nSource: `%s`\n\nNo deployment performed.\n' "$DIGEST" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
